name: Update Feeds

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"  # every day at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Update RSS & Sitemap
        run: python update_feeds.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add rss.xml sitemap.xml
          git commit -m "Auto-update RSS & Sitemap" || echo "No changes"
          git push
